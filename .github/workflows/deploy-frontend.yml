name: Deploy Frontend VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_BACKEND_PATH: ${{ vars.VPS_BACKEND_PATH }}
      VPS_FRONTEND_PATH: ${{ vars.VPS_FRONTEND_PATH }}
    steps:
      - name: Deploy frontend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            FRONTEND_PATH="${VPS_FRONTEND_PATH:-/opt/it-job/it-job-platform-fe}"

            cd "$FRONTEND_PATH"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            FRONTEND_DIR="$FRONTEND_PATH" PLATFORM_DIR="$BACKEND_PATH" bash ./scripts/dev/deploy-frontend-vps.sh
