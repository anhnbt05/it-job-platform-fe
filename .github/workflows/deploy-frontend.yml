name: Deploy Frontend VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-frontend-vps
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner }}/it-job-platform-frontend:main
            ghcr.io/${{ steps.prep.outputs.owner }}/it-job-platform-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=it-job-platform-frontend
          cache-to: type=gha,mode=max,scope=it-job-platform-frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      VPS_BACKEND_PATH: ${{ vars.VPS_BACKEND_PATH }}
    steps:
      - name: Deploy frontend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"

            echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            cd "$BACKEND_PATH"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            docker compose -f docker-compose.yml -f docker-compose.app.yml pull frontend
            docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --force-recreate frontend
            for attempt in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:3000" >/dev/null; then
                break
              fi

              if [ "$attempt" -eq 40 ]; then
                echo "frontend did not become ready in time" >&2
                exit 1
              fi

              sleep 3
            done
            docker image prune -f
            docker logout ghcr.io || true
